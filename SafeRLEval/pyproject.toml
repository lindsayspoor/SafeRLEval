[project]
name = "saferleval"
version = "0.1.0"
description = "Evaluation metrics and visualisations for Safe RL"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "wandb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["SafeRLEval"]
